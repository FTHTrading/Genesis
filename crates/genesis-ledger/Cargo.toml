[package]
name    = "genesis-ledger"
version = "0.1.0"
edition = "2021"
description = "In-house micropayment ledger, pricing engine, and settlement batcher for Genesis Protocol"

[dependencies]
# Serialization
serde      = { version = "1", features = ["derive"] }
serde_json = "1"

# Error handling
thiserror = "1"

# IDs
uuid = { version = "1", features = ["v4", "serde"] }

# Time
chrono = { version = "0.4", features = ["serde"] }

# Hashing (for settlement anchor proof)
sha3 = "0.10"
hex  = "0.4"

# Logging
tracing = "0.1"

# Concurrency
parking_lot = "0.12"
